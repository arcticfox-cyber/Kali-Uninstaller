name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python syntax
        run: python -m py_compile KaliUninstaller/kali_uninstaller.py

      - name: Check shell script syntax
        run: |
          sh -n KaliUninstaller/install.sh
          sh -n KaliUninstaller/run.sh
          sh -n KaliUninstaller/uninstall_me.sh

      - name: Verify required project files
        run: |
          test -s README.md
          test -s LICENSE
          test -s logo.png
          test -s KaliUninstaller/README.md
          test -s KaliUninstaller/kali_uninstaller.py
          test -s KaliUninstaller/assets/logo.png
          test -s KaliUninstaller/assets/logo_small.png
          test -s KaliUninstaller/assets/splash.png
